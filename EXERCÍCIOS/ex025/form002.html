<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Teste de formulário</h1>

    <form action="cadastro.php" method="post" autocomplete="off">
        <p>
            <label for="iusu">Usuario:</label> 
            <input type="text" name="usu" id="iusu" required minlength="3" maxlength="15" size="07" placeholder="nome de usuário" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha:</label>            <input type="password" name="sen" id="isen" required minlength="08" maxlength="15" size="08" placeholder="digite sua senha" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
